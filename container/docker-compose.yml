services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tms-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tms
      DB_USERNAME: tms
      DB_PASSWORD: tms

      REDIS_HOST: redis
      REDIS_PORT: 6379

      DDL_AUTO: update


  postgres:
    image: postgres:16-alpine

    container_name: tms-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: tms
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: tms

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms -d tms"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine

    container_name: tms-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  postgres_data:
  redis_data: